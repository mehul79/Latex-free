services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: latex
      POSTGRES_PASSWORD: latex
      POSTGRES_DB: latex_free
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latex -d latex_free"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
